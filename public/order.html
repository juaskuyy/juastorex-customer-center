<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detail Order JuaStore</title>
  <link rel="stylesheet" href="order.css">
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="logo">JS</div>
      <p class="eyebrow">JUASTORE CUSTOMER CENTER</p>
      <h1 id="product">Memuat order...</h1>
      <p id="message" class="muted"></p>

      <div id="details" class="hidden">
        <a id="claimLink" class="claim-button">
  🛡️ Ajukan Garansi
        </a>
        <div class="item"><span>Kode order</span><strong id="code"></strong></div>
        <div class="item"><span>Durasi produk</span><strong id="duration"></strong></div>
        <div class="item"><span>Sisa durasi produk</span><strong id="productRemaining"></strong></div>
        <div class="item"><span>Durasi garansi</span><strong id="warranty"></strong></div>
        <div class="item"><span>Sisa garansi</span><strong id="warrantyRemaining"></strong></div>
        <div class="item"><span>Status garansi</span><strong id="status"></strong></div>
      </div>
    </section>
  </main>
  <script src="order.js"></script>
</body>
</html>
